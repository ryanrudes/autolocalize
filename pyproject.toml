[project]
name = "autolocalize"
version = "0.1.0"
description = "Fast initial robot localization on occupancy grids using LIDAR corner features"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Ryan Rudes" }]
keywords = [
    "robotics",
    "localization",
    "lidar",
    "slam",
    "occupancy-grid",
    "ros",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
autolocalize = "autolocalize.__main__:main"

[project.urls]
Homepage = "https://github.com/ryanrudes/autolocalize"
Repository = "https://github.com/ryanrudes/autolocalize"
Issues = "https://github.com/ryanrudes/autolocalize/issues"

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.source-dir = "cpp"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
packages = ["autolocalize"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "rich>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration-style tests (random pose batches)",
    "stress: large Monte Carlo localization batches (e.g. 1000 poses)",
]
