[project]
name = "autolocalize"
version = "0.1.0"
description = "Fast initial robot localization on occupancy grids using LIDAR corner features"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Ryan Rudes" }]
keywords = [
    "robotics",
    "localization",
    "lidar",
    "slam",
    "occupancy-grid",
    "ros",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
autolocalize = "autolocalize.__main__:main"

[project.urls]
Homepage = "https://github.com/ryanrudes/autolocalize"
Repository = "https://github.com/ryanrudes/autolocalize"
Issues = "https://github.com/ryanrudes/autolocalize/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autolocalize"]

[tool.hatch.build.targets.wheel.force-include]
"maps" = "autolocalize/maps"

[tool.hatch.build.targets.sdist]
include = [
    "/autolocalize",
    "/maps",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration-style tests (random pose batches)",
    "stress: large Monte Carlo localization batches (e.g. 1000 poses)",
]
